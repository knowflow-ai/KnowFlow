version: '3.8'

services:
  rag-evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - RAGFLOW_BASE_URL=${RAGFLOW_BASE_URL}
        - RAGFLOW_API_KEY=${RAGFLOW_API_KEY}
    image: rag-evaluation:latest
    container_name: rag-evaluation
    restart: unless-stopped
    
    ports:
      - "5003:80"
    
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    
    env_file:
      - .env.docker
    
    environment:
      - TZ=Asia/Shanghai
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/evaluation/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - rag-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rag-network:
    external: true
    name: ragflow_ragflow
